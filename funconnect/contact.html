<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Fun Connect AIoT</title>
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html" aria-label="Fun Connect AIoT"><img class="logo-img" src="assets/funconnect-logo-zh-hant.png" alt="Fun Connect logo" /><span>智趣通物聯</span></a>
      <button class="menu" type="button" id="menu" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
      <nav class="links" id="links" aria-label="Main navigation">
        <a href="index.html" data-i18n="nav.home">首頁</a>
        <a href="project.html" data-i18n="nav.project">AIoT Project 創作技巧</a>
        <a href="product.html" data-i18n="nav.products">產品與報價</a>
        <a href="contact.html" aria-current="page" data-i18n="nav.contact">聯絡了解</a>
        <div class="lang-switch" aria-label="Language"><button type="button" data-lang="zh-Hant">繁</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh-Hans">简</button></div>
        <a class="btn primary" href="#privacy-note" data-i18n="contact.privacyShort">聯絡方式說明</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy"><p class="eyebrow">Talk to Fun Connect</p><h1 data-i18n="contact.title">告訴我們學校的課堂與導入需求。</h1><p class="lead" data-i18n="contact.lead">您可以索取香港學校方案、預約實機演示、安排到校教學，或討論一年 / 三年訂閱與多學科 AIoT 學習導入。</p></div>
        <figure class="image-card"><img src="assets/learning-aiot.png" alt="AIoT learning and school enquiry visual" /></figure>
      </div>
    </section>

    <section class="section" id="inquiry">
      <div class="wrap contact-grid">
        <div class="panel privacy-panel" id="privacy-note">
          <p class="eyebrow" data-i18n="contact.privacyLabel">Portfolio copy</p>
          <h2 data-i18n="contact.privacyTitle">聯絡資料已隱藏</h2>
          <p class="privacy-note" data-i18n="contact.privacy">為保障私隱，本作品集版本已移除電話及即時通訊聯絡方式。</p>
        </div>

        <aside class="side-stack">
          <div class="info-card"><h3 data-i18n="contact.flowTitle">跟進流程</h3><div class="steps"><div class="step"><span class="step-num">01</span><div><h3 data-i18n="contact.f1t">了解需求</h3></div></div><div class="step"><span class="step-num">02</span><div><h3 data-i18n="contact.f2t">實機演示</h3></div></div><div class="step"><span class="step-num">03</span><div><h3 data-i18n="contact.f3t">方案報價</h3></div></div></div></div>
        </aside>
      </div>
    </section>
  </main>

  <footer><div class="wrap footer-grid"><div><strong>智趣通物聯</strong><br /><span data-i18n="footer.desc">面向香港學校與教育機構的 AIoT STEM 學習方案。</span></div><div><a href="index.html" data-i18n="nav.home">首頁</a> · <a href="project.html" data-i18n="nav.project">AIoT Project 創作技巧</a> · <a href="product.html" data-i18n="nav.products">產品與報價</a></div></div></footer>
