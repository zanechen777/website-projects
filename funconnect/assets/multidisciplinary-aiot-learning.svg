<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AIoT multidisciplinary learning scene</title>
  <desc id="desc">A premium educational technology illustration showing sensor data flowing into an AI agent that creates poetry, science explanations, and skills.</desc>
  <defs>
